<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda — Classic Barbershop</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0907">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Classic Agenda">
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=202610071502">
  <link rel="stylesheet" href="admin.css?v=202610071502">
</head>
<body class="bh">
  <header class="bh-top">
    <div class="bh-top__in">
      <a href="index.html" class="brand" aria-label="Naar de website"><img class="brand__logo" src="img/logo.png" alt="Classic Barbershop — Gentlemen's cut and shave" width="63" height="58"></a>
      <div class="bh-top__loc">
        <span class="bh-live" id="live" title="Live verbonden"><span></span></span>
        <span>Agenda <b id="locName">…</b></span>
      </div>
      <div class="bh-top__actions">
        <button type="button" class="bh-chip" id="installBtn" hidden>Installeer app</button>
        <button type="button" class="bh-icon" id="notifyBtn" title="Meldingen bij nieuwe afspraken" aria-label="Meldingen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <button type="button" class="bh-icon" id="logoutBtn" title="Uitloggen" aria-label="Uitloggen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>
    <nav class="bh-tabs" role="tablist">
      <button role="tab" data-tab="agenda" aria-selected="true">Agenda</button>
      <button role="tab" data-tab="upcoming" aria-selected="false">Komende <span class="bh-badge" id="upCount"></span></button>
      <button role="tab" data-tab="clients" aria-selected="false">Klanten</button>
    </nav>
  </header>

  <main class="bh-main">
    <!-- AGENDA -->
    <section data-view="agenda">
      <div class="bh-daynav">
        <button type="button" class="bh-icon" id="prevDay" aria-label="Vorige dag">‹</button>
        <label class="bh-date">
          <span id="dayTitle">…</span>
          <input type="date" id="dayPick" aria-label="Kies een datum">
        </label>
        <button type="button" class="bh-icon" id="nextDay" aria-label="Volgende dag">›</button>
        <button type="button" class="bh-chip" id="todayBtn">Vandaag</button>
      </div>
      <div class="bh-week" id="week"></div>
      <div class="bh-stats" id="stats"></div>
      <div class="bh-toolbar">
        <label class="ed-check"><input type="checkbox" id="showCancelled"> Toon geannuleerd</label>
      </div>
      <div class="bh-timeline" id="timeline"><div class="bload"><span class="spinner"></span>Agenda laden…</div></div>
    </section>

    <!-- KOMENDE -->
    <section data-view="upcoming" hidden>
      <div class="bh-search"><input type="search" id="upSearch" placeholder="Zoek op naam, telefoon of dienst…"></div>
      <div id="upList"></div>
    </section>

    <!-- KLANTEN -->
    <section data-view="clients" hidden>
      <div class="bh-search">
        <input type="search" id="clSearch" placeholder="Zoek klant…">
        <button type="button" class="bh-chip" id="exportBtn">Exporteer (CSV)</button>
      </div>
      <div id="clList"></div>
    </section>
  </main>

  <div class="bh-fab">
    <button type="button" class="bh-fab__btn bh-fab__btn--ghost" id="blockBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Blokkeren
    </button>
    <button type="button" class="bh-fab__btn" id="addBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Afspraak
    </button>
  </div>

  <div class="bh-modal" id="modal" aria-hidden="true">
    <div class="bh-modal__box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="bh-modal__head"><h2 id="mTitle"></h2><button type="button" class="ed-x" data-mclose aria-label="Sluiten">✕</button></div>
      <div class="bh-modal__body" id="mBody"></div>
    </div>
  </div>

  <script src="config.js?v=202610071502"></script>
  <script type="module" src="js/beheer.js?v=202610071502"></script>
</body>
</html>
